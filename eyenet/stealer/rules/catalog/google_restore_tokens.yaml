id: google_restore_tokens
version: 1
layer: content
family: google_oauth_tokens
priority: 90
path_glob: '**/*.txt'
description: "Chromium-family 'Restore_<Browser>_<Profile>.txt' files. One line per\
  \ signed-in Google account: '<refresh_token>:<gaia_id>'.\nRefresh tokens have the\
  \ universal '1//0' prefix; GAIA IDs are 20+ digit integers. Both are stable: the\
  \ refresh token mints access tokens against Google OAuth2 endpoints until the victim\
  \ revokes or changes their password; the GAIA ID uniquely identifies the account\
  \ independent of email aliases. Per-victim multi-account files are common (up to\
  \ 7 accounts per Chrome profile observed in Khazan).\nStealers also emit two non-recovery\
  \ sentinel lines that must be rejected as noise:\n  fake-<uuid>:<hex>        empty-slot\
  \ placeholder\n  invalid_refresh_token:N  Google-rotated token; GAIA still identifies\n\
  \                           the compromised account, but the token is\n        \
  \                   dead so we only keep the gaia_id.\n\nWe reject the 'fake-' rows\
  \ outright (zero intel). We keep the invalid_refresh_token rows because the gaia_id\
  \ itself is CTI.\n"
match:
  type: regex
  pattern: (?m)^(?P<refresh_token>(?:1//0[A-Za-z0-9_-]+)|invalid_refresh_token):(?P<gaia_id>\d{15,25})$
  pre_contains: 1//0
reject_patterns:
- ^fake-
extract:
  fields:
  - refresh_token
  - gaia_id
ttps:
- T1528
