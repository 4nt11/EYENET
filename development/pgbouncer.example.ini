# EYENET pgbouncer example — high-ingest fronting for the Postgres backend.
#
# WHY: many collector processes each hold a small asyncpg pool; without a pooler
# the connection count blows past Postgres `max_connections`. pgbouncer in
# TRANSACTION mode multiplexes them onto a small server pool. See
# development/POSTGRES_PORT.md §5.
#
# AUTH: scram-sha-256 ONLY. md5 is deprecated and weak — do NOT use it.
# Generate the userlist entry with a SCRAM verifier (never a plaintext password):
#   psql -Atq -c "SELECT rolname, rolpassword FROM pg_authid WHERE rolname='eyenet'"
# and copy the "SCRAM-SHA-256$..." value into userlist.txt:
#   "eyenet" "SCRAM-SHA-256$4096:...."
#
# WIRING: point the app's request path at pgbouncer and the DDL/migration path at
# Postgres DIRECTLY (migrations use session features that transaction pooling
# breaks). In code:
#   get_repository(url="postgresql://eyenet@pgbouncer:6432/eyenet",
#                  ddl_url="postgresql://eyenet@postgres:5432/eyenet")
# The audit DB (eyenet_audit) is proxied by the same wildcard below.
#
# asyncpg + transaction pooling: the backend already sets statement_cache_size=0
# (eyenet/storage/postgres_repo/database.py) so the prepared-statement cache
# cannot collide across multiplexed connections. Nothing else to tune app-side.

[databases]
# Wildcard: proxy every DB name through to Postgres (main + audit) unchanged.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# TRANSACTION mode is the whole point — one server conn per transaction, released
# on commit. The advisory-lock hash chains are transaction-scoped, so they are
# safe here; session-mode would defeat the pooling win.
pool_mode = transaction

# Size to your ingest fan-out. Rule of thumb: default_pool_size * (number of
# distinct databases * users) stays well under Postgres max_connections.
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5

# asyncpg sends these on connect; pgbouncer does not track them in txn mode.
ignore_startup_parameters = extra_float_digits,search_path,options

# Recycle server connections so a long-lived backend doesn't pin one forever.
server_idle_timeout = 600
