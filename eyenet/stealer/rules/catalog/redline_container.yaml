id: redline_container
version: 2
layer: container
family: redline
priority: 100
description: >
  RedLine victim-folder predicate, v2 (predicate-tree form). Explicit
  Opus / json_v2 / Lumma / StealC exclusions so a drop that LOOKS like
  RedLine but actually isn't gets correctly rejected. Requires at least
  two of the three RedLine-specific sidecar signals (Browsers/ dir with
  per-browser Passwords layout, InstalledSoftware.txt, Screenshot.jpg).

  Opus-exclusion arm: a UserInformation.txt drop that ALSO carries
  worklog.txt OR a Clients/<messenger> file is NOT RedLine, no matter
  how many other sidecars match. Previously this rule required only
  the filename and the min_score; now it says so explicitly.
match:
  type: folder
  predicate:
    and:
      - path: UserInformation.txt
      - not: { path: pc_info.json }
      - not: { path: System.txt }
      - not: { path: information.txt }
      - not:
          or:
            - path: worklog.txt
            - path: Clients/DiscordTokens.txt
            - path: Clients/SteamTokens.txt
            - path: Clients/Roblox.txt
            - path: Clients/MAX.txt
            - path: Telegram/
            - path: Extensions/
            - path: Wallets/
      - at_least:
          count: 2
          of:
            - path: Browsers/
            - path: Passwords.txt
            - path: InstalledSoftware.txt
            - path: Screenshot.jpg
            - path: Clipboard.txt
            - path: Environment.txt
            - path: ProcessList.txt
ttps: []
