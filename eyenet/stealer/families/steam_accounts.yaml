references:
  - title: Valve KeyValues (VDF) format reference
    url: https://developer.valvesoftware.com/wiki/KeyValues
  - title: Steam loginusers.vdf schema (community)
    url: https://help.steampowered.com/en/faqs/view/16E9-8CB2-FE8C-D7C4
notes: >
  loginusers.vdf lives at Steam/config/loginusers.vdf on Windows (or in
  the vowel-stripped Software/Stam/ sidecar that json_v2 stealers
  emit). Lists every account that has touched this Steam install,
  keyed by SteamID64 (76561198*), with AccountName + PersonaName +
  Timestamp + AutoLogin + RememberPassword flags. The RememberPassword
  flag paired with a captured ssfn* session file = session-takeover
  without the account password.
