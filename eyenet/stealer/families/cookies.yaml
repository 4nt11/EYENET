slug: cookies
name: Browser cookies (Netscape format)
status: active
kind: content
schema: 2
first_seen_year: 1994
aliases: [netscape-cookies, cookies.txt]
signature_files: []
loaders: []
distribution_channels:
  - inside stealer-log drops (every family exports browser cookies)
  - standalone cookie dumps on forum marketplaces
references:
  - title: Netscape cookie file format (via curl.se)
    url: https://curl.se/docs/http-cookies.html
notes: >
  Meta-family for the de-facto cookie.txt format. Tab-separated with
  seven columns: domain, include_subdomains, path, secure, expires,
  name, value. Lines starting with # are comments and blank lines are
  skipped. Every stealer family ships cookies in this format somewhere
  under Browsers/ or Cookies/; our Netscape probe rule classifies the
  file shape regardless of which stealer produced it.
