id: combolist_schemeless
version: 1
layer: content
family: combolist
priority: 12
path_glob: '**/*.txt'
requires_container_family: combolist
description: 'Schemeless host combos: example.com/path:user:pass (no http:// prefix).
  Mirrors ulpextract.leadingURL which accepts IPv4 or dotted-host anchors. Lower priority
  (12) than scheme-anchored rules so an http:// line still matches the stricter probe
  first.

  '
match:
  # NO pre_contains: the pattern is COLON-separated, so the previous
  # pre_contains '|' (copied from the pipe rules) was a hard prefilter that
  # skipped every colon line -> this rule never fired and all schemeless
  # host:user:password combos were silently dropped (v1.4 fix). The rule is
  # already scoped by requires_container_family: combolist + the **/*.txt
  # glob + the anchored regex, so no literal prefilter is needed.
  type: regex
  pattern: ^(?P<url>(?:\d{1,3}(?:\.\d{1,3}){3}|(?:[a-z0-9-]+\.)+[a-z]{2,})(?:/[^\s:;|,]*)?):(?P<user>[^:\s]+):(?P<password>\S+)$
  multiline: true
extract:
  fields:
  - url
  - user
  - password
normalize:
- verb: derive_url_parts
  field: url
  host_to: host
  scheme_to: scheme
  tld_to: tld
ttps:
- T1555.003
