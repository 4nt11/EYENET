id: credentials_windows
version: 1
layer: content
family: windows_credentials
priority: 80
path_glob: "**CredentialsWindows*"
description: >
  Windows Credential Manager export (DPAPI-unwrapped). Blocks are
  Target / User / Pass separated by blank lines. Pass may be either a
  plaintext password OR a long base64/JWT token (OAuth refresh, Xbox
  Live auth, OneDrive, etc.); operator should treat anything in the
  Pass field as sensitive regardless of apparent shape. User is often
  'N/A' when the credential is a bearer token with no explicit user.
match:
  type: regex
  pattern: 'Target:\s*(?P<target>[^\n]*)\nUser:\s*(?P<user>[^\n]*)\nPass:\s*(?P<password>[^\n]*)'
extract:
  fields: [target, user, password]
