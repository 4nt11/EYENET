id: exodus_seed_seco_header
version: 1
layer: content
family: exodus_wallet
priority: 95
path_glob: "**seed.seco"
description: >
  First DSL rule against a BINARY wallet file. seed.seco opens with
  a length-prefixed ASCII-safe header:

    0x00  'SECO'                     magic
    0x04  8 bytes                    reserved
    0x0C  0x12 + 'seco-v0-scrypt-aes'  scheme (len-prefixed)
    0x1F  0x06 + 'Exodus'             vendor (len-prefixed)
    0x26  0x06 + '26.7.1'             version (len-prefixed)
    0x2D  zero padding, then AES-GCM ciphertext

  Every byte in the header is below 0x80, so the matcher reads the
  file as UTF-8-with-replace and the regex still lands cleanly on
  the plaintext spans. The scrypt-AES ciphertext below the header
  is bytes we neither need nor touch.

  Pairs with the exodus_passphrase_json rule to classify wallet
  encryption state + the exodus.conf.json to tag wallet age +
  currency.

  Mark on the ingest side: the gotractor file-reader will truncate
  at some byte budget; current default caps per-file text at a few
  MB and seed.seco rarely exceeds 50 KB, so we always get the header
  in-window.
match:
  type: regex
  pattern: 'SECO.{0,16}seco-(?P<seco_scheme>v\d-[\w-]+).{1,2}(?P<seco_vendor>Exodus|Electrum|Atomic)\x06(?P<seco_version>[\d.]+)'
extract:
  fields: [seco_scheme, seco_vendor, seco_version]
