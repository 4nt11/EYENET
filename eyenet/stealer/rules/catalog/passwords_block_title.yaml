id: passwords_block_title
version: 1
layer: content
family: browser_passwords
priority: 80
path_glob: "**/*.txt"
description: >
  Title-case passwords.txt block format. 402 of 439 Khazan victims
  ship this shape (dominant). Blocks separated by blank lines.
  Keys: Soft, Host, Login, Password. Host may contain either https://
  URLs OR android://<hash>@<pkg>/ app references.
  REGEX matcher is single-shot per call; bulkParse iterates every
  block when the Workbench asks for all records.
match:
  type: regex
  pattern: 'Soft:\s*(?P<soft>[^\n]*)\nHost:\s*(?P<host>[^\n]*)\nLogin:\s*(?P<login>[^\n]*)\nPassword:\s*(?P<password>[^\n]*)'
extract:
  fields: [soft, host, login, password]
