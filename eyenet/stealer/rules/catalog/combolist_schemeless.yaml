id: combolist_schemeless
version: 1
layer: content
family: combolist
priority: 12
path_glob: "**/*.txt"
requires_container_family: combolist
description: >
  Schemeless host combos: example.com/path:user:pass (no http:// prefix).
  Mirrors ulpextract.leadingURL which accepts IPv4 or dotted-host anchors.
  Lower priority (12) than scheme-anchored rules so an http:// line
  still matches the stricter probe first.
match:
  type: regex
  pattern: '^(?P<url>(?:\d{1,3}(?:\.\d{1,3}){3}|(?:[a-z0-9-]+\.)+[a-z]{2,})(?:/[^\s:;|,]*)?):(?P<user>[^:\s]+):(?P<password>\S+)$'
  multiline: true
extract:
  fields: [url, user, password]
ttps:
  - T1555.003
