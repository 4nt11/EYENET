id: passwords_block_divider
version: 1
layer: content
family: browser_passwords
priority: 80
path_glob: "**/*.txt"
description: >
  RedLine Passwords.txt block shape. Keys: URL, Username, Password.
  Blocks separated by 15 '=' chars on their own line. No Soft/SOFT
  field (RedLine stores the browser elsewhere). Fires alongside the
  two block-shape rules; only one anchors in any given file.
match:
  type: regex
  pattern: 'URL:\s*(?P<url>[^\n]*)\nUsername:\s*(?P<user>[^\n]*)\nPassword:\s*(?P<password>[^\n]*)'
extract:
  fields: [url, user, password]
normalize:
  - verb: derive_url_parts
    field: url
    host_to: host
    scheme_to: scheme
    tld_to: tld
ttps:
  - T1555.003
