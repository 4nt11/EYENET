id: redline_user_information_txt
version: 1
layer: content
family: redline
priority: 100
path_glob: UserInformation.txt
requires_container_family: redline
description: >
  RedLine header. Covers TWO shape variants seen in the wild:

    textbook  (short keys):  Computer / User / OS / CPU / RAM
    newer     (long keys):   Computer Name / User Name /
                             Operation System / Installed RAM / Processor
                             (plus Traffic / Log date / Version Build /
                             Admin Group / Integrity / TimeZone)

  requires_keys gates on HWID alone (present in both). Both extract maps
  write to the SAME output fields where they overlap (hostname/user/os/
  cpu/ram/language), so a rule change doesn't fragment downstream
  schemas. Only one of the two key styles is typically present per
  file, so the overlapping extracts don't collide.
match:
  type: keyvalue
  separator: ": "
  strip_whitespace: true
  requires_keys:
    - HWID
extract:
  keys:
    # Universal (either variant)
    HWID: hwid
    IP: ip
    Country: country
    Screen: screen
    Keyboards: keyboards
    Uptime: uptime_minutes
    Path: payload_path
    AV: av
    # Textbook (short-key) variant
    Computer: hostname
    User: user
    OS: os
    CPU: cpu
    RAM: ram
    Language: language
    # Newer (long-key) variant
    Computer Name: hostname
    User Name: user
    Operation System: os
    Processor: cpu
    Installed RAM: ram
    System Language: language
    Log date: log_date
    Traffic: traffic_source
    Version Build: build_version
    Admin Group: admin_group
    Integrity: integrity_level
    TimeZone: timezone
    Graphics card: gpu
    Domain Name: domain
normalize:
  - { verb: strip_whitespace, field: hostname }
  - { verb: uppercase,        field: hwid }
  - { verb: lowercase,        field: country }
  - { verb: replace_re2,      field: cpu, pattern: '\s+', replacement: ' ' }
  - { verb: int_from_string,  field: ram }
  - { verb: int_from_string,  field: uptime_minutes }
ttps:
  - T1555.003
  - T1082
