<!-- @dsCard group="Colors" viewport="700x130" name="Text on Black" subtitle="Three-step ink hierarchy" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--black);padding:20px;font-family:var(--font-sans)}
.row{display:flex;flex-direction:column;gap:12px}
.line{display:flex;align-items:baseline;gap:14px}
.big{font-size:20px}.tag{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:170px;flex:0 0 auto}</style></head>
<body><div class="row">
<div class="line"><span class="tag">--text · #dfe5e5</span><span class="big" style="color:var(--text)">Primary evidence text</span></div>
<div class="line"><span class="tag">--text-muted · #9aa0aa</span><span class="big" style="color:var(--text-muted)">Secondary / metadata</span></div>
<div class="line"><span class="tag">--text-faint · #7a7d8c</span><span class="big" style="color:var(--text-faint)">Faint labels &amp; hints</span></div>
</div></body></html>
