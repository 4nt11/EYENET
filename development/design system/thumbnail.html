<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;height:100%}
.tile{display:flex;width:1280px;height:854px;background:var(--black)}
.main{flex:1;display:flex;align-items:center;justify-content:center;background:var(--accent)}
.mark{font-family:var(--font-mono);font-weight:700;font-size:180px;letter-spacing:.06em;color:#fff}
.strip{width:320px;display:flex;flex-direction:column}
.strip>div{flex:1}
</style></head>
<body>
<div class="tile">
  <div class="main"><span class="mark">EYENET</span></div>
  <div class="strip">
    <div style="background:#e07b76"></div>
    <div style="background:#c2453f"></div>
    <div style="background:#a259c4"></div>
    <div style="background:#141519"></div>
  </div>
</div>
</body></html>
