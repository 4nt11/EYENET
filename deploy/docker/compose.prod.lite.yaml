# EYENET prod LITE override - the modest box: 6 cores / 16 GB / 320 GB SSD + Wasabi.
#
# The reduced "lite" deployment: CORE services + the ULP extractors (stealer
# profile) only. No observability tier, no classifier, no incidents (torch would
# OOM). This box is operator-only, never client-facing, so sluggish-but-correct
# is the accepted trade. Drop this override on bigger boxes for the full stack.
#
# Run it:
#   docker compose -f compose.yaml -f compose.prod.lite.yaml --profile stealer up -d
#
# HOST PREREQ: put the stateful data dirs on the SSD, not wherever Docker's
# default root lives. Either mount the SSD at /var/lib/docker, OR bind-mount the
# two data dirs to an SSD path (edit the volumes to driver_opts binds).
# Postgres (the irreplaceable corpus) + ClickHouse local cache MUST be on SSD.
#
# RAM budget @ 16 GB (core + stealer): postgres ~2G, clickhouse capped 4G,
# 12 python workers ~2.5G, nats/tor/flaresolverr ~0.7G, OS ~0.7G, so ~10G total.
# ~6 G headroom for query/spacy/verifier spikes. Comfortable.
services:
  # ClickHouse is Wasabi-primary (local disk = cache). Cap it hard so a big
  # query can't balloon and swap the box. CH 24.8 reads the cgroup limit and
  # auto-sets max_server_memory_usage to ~0.9x it, so mem_limit IS the cap,
  # no config.d xml needed.
  # ponytail: cgroup-aware cap, add an explicit max_server_memory_usage xml only
  # if CH ever ignores the cgroup limit (it does not on 24.8).
  clickhouse:
    mem_limit: 4g
    # Wasabi-primary tiered storage: the stealer ULP corpus lives in a Wasabi
    # bucket, with a local SSD cache in front (see clickhouse/config.d/
    # wasabi-storage.xml). Credentials are injected via env vars (from_env in
    # the XML) so no secrets touch the image. Set all four EYENET_WASABI_* in
    # deploy/docker/.env on the prod host before first boot, or CH will boot
    # fine but any table declaring `storage_policy='wasabi_primary'` will
    # fail on first write.
    environment:
      EYENET_WASABI_ENDPOINT: "${EYENET_WASABI_ENDPOINT:-}"
      EYENET_WASABI_ACCESS_KEY_ID: "${EYENET_WASABI_ACCESS_KEY_ID:-}"
      EYENET_WASABI_SECRET_ACCESS_KEY: "${EYENET_WASABI_SECRET_ACCESS_KEY:-}"
      EYENET_WASABI_REGION: "${EYENET_WASABI_REGION:-us-east-1}"
    volumes:
      # Mount the storage config into /etc/clickhouse-server/config.d/. CH
      # auto-loads every *.xml there on boot.
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro

  # flaresolverr runs headless Chromium, it balloons. Leash it. If no active
  # collector needs Cloudflare-solving, just do not scale it / drop it entirely.
  flaresolverr:
    mem_limit: 768m

  # stealer-processor opts the `creds` ReplacingMergeTree into the Wasabi
  # tiered policy defined in clickhouse/config.d/wasabi-storage.xml. On dev
  # this env var is unset and CH uses the implicit `default` local policy;
  # here we flip it so new tables land on Wasabi with the local SSD cache.
  # Existing tables are not migrated by setting this -- that is a separate
  # ALTER + data move.
  stealer-processor:
    environment:
      EYENET_CLICKHOUSE_STORAGE_POLICY: "wasabi_primary"

  # Postgres stays on SSD so synchronous_commit stays ON (full durability, this
  # is a forensic corpus with a hash-chained audit log). No HDD escape hatches
  # needed. Left otherwise at image defaults; bump shared_buffers to ~2G here
  # only if you measure it starved, not before.
  # ponytail: default config is fine on SSD @ 16G, tune when a real slow query says so.

  # Caddy edge: the ONLY published surface. Serves the static SPA + reverse-proxies /v1 to
  # the h2-only API, terminates public TLS (Let's Encrypt for EYENET_DOMAIN, Caddy's internal
  # CA for localhost in dev) and offers h1/h2/h3. Not in the base compose on purpose: dev
  # uses `vite dev`, prod uses this.
  edge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.edge
      args:
        EYENET_VERSION: "${EYENET_VERSION:-dev}"
    image: eyenet:edge
    restart: unless-stopped
    environment:
      EYENET_DOMAIN: "${EYENET_DOMAIN:-localhost}"
      # Must be NON-EMPTY: Caddy's {$VAR:default} only falls back when the var is UNSET,
      # not empty, so an empty value makes the `email` directive fail to parse. The
      # placeholder is unused in dev (localhost = internal CA, no ACME); set a real address
      # for prod so Let's Encrypt can send expiry notices.
      EYENET_ACME_EMAIL: "${EYENET_ACME_EMAIL:-admin@example.com}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy-data:/data # Let's Encrypt certs + state; persists across restarts
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
