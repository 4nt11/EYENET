<!-- @dsCard group="Type" viewport="700x200" name="System Sans — UI & Prose" subtitle="System stack for chrome, labels, prose" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--black);padding:20px;font-family:var(--font-sans);color:var(--text)}
.stack{display:flex;flex-direction:column;gap:12px}
.spec{display:flex;align-items:baseline;gap:16px}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:120px;flex:0 0 auto}
.h1{font-size:28px;font-weight:600}.h3{font-size:18px;font-weight:600}.body{font-size:14px;color:var(--text-muted);max-width:380px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:600}</style></head>
<body><div class="stack">
<div class="spec"><span class="tag">28 / 600</span><span class="h1">Case overview</span></div>
<div class="spec"><span class="tag">18 / 600</span><span class="h3">Live event feed</span></div>
<div class="spec"><span class="tag">14 / 400</span><span class="body">Prose sits in the system sans; evidence never does.</span></div>
<div class="spec"><span class="tag">11 / caps</span><span class="lbl">Section label</span></div>
</div></body></html>
