# EYENET - Loki config (Docker stack, --profile observability).
#
# Single-binary Loki, filesystem storage, 14-day retention to match Prometheus
# (--storage.tsdb.retention.time=14d) and Tempo. Logs arrive via OTLP from the
# otel-collector's filelog receiver (which tails the container json-file logs).
# OTLP ingest is enabled by default in Loki 3.x at POST /otlp/v1/logs.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14 days. The compactor (below) does the actual deletion.
  retention_period: 336h
  # structlog ships trace_id/span_id/service as structured metadata, not labels.
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
