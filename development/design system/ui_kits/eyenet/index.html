<!DOCTYPE html><html><head><meta charset="utf-8"><title>EYENET — Observation Console</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0;height:100%;background:var(--black)}
#root{height:100vh}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:0}
*::-webkit-scrollbar-track{background:var(--surface)}
a{color:var(--link)}a:hover{color:var(--link-hover)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="CaseView.jsx"></script>
<script type="text/babel">
function App(){
  const [selected,setSelected]=React.useState('CASE-2026-0417');
  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:'var(--black)'}}>
      <window.TopBar caseId={selected}/>
      <div style={{flex:1,minHeight:0,display:'flex'}}>
        <window.Sidebar selected={selected} onSelect={setSelected}/>
        <window.CaseView/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
