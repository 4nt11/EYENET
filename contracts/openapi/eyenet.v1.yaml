openapi: 3.1.0
info:
  title: EYENET HTTP API
  version: "1.0.0-pre"
  summary: Operator-grade evidence platform — REST + SSE surface
  description: |
    EYENET v1 HTTP API. Authoritative source of truth: `API_PLAN.md`.

    Operational invariants surfaced here:
      * All errors are `application/problem+json` (RFC 7807) using `ProblemDetail`.
      * All list endpoints are opaque-cursor paginated; no offset.
      * All writes are bus-published after a durable audit append; clients receive `202 + WriteAccepted` and must poll.
      * SSE streams declare per-event payloads via the `x-eyenet-sse-events` operation extension.
      * Bearer auth: short-lived RS256 access JWT OR a Personal Access Token (`eyenet_pat_...`).
        Authority (scopes) is resolved server-side per request — never trust scope claims in a token.
      * HTTP/2 mandatory. HTTP/1.1 is refused at the listener.
  contact:
    name: EYENET maintainers
    url: https://eyenet.local/
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://eyenet.local
    description: Operator deployment (local-bind by default; reverse-proxied for TLS)

tags:
  - name: auth
    description: Login, refresh, logout, PAT and stream-token minting.
  - name: actors
    description: Actor reads — detail, neighbors, observations, timeline.
  - name: personas
    description: Persona reads — detail and member list.
  - name: linkages
    description: Linkage reads and operator decisions (confirm/reject/suspect).
  - name: graph
    description: Aggregate graph stats and actor search.
  - name: audit
    description: Audit chain reads and integrity verification.
  - name: identities
    description: Identity-pool operator actions (claim/release/freeze_all).
  - name: control
    description: System-wide operator actions (panic).
  - name: sources
    description: Sources & SourceDomains — the discovery storage surface (M9.D1).
  - name: collectors
    description: Collector fleet management (M9.D2).
  - name: candidates
    description: GroupCandidate triage queue (M9.D3).
  - name: stream
    description: Server-Sent Events. Storage-backed replay via `Last-Event-ID`.
  - name: health
    description: Liveness, readiness, and Prometheus metrics scrape.

security:
  - bearerAuth: []

paths:
  # ────────────────────────────────────────────────────────────────────────
  # 3.1 Auth
  # ────────────────────────────────────────────────────────────────────────
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: auth_login
      security: []
      summary: Exchange username + password for an access JWT — OR an MFA challenge.
      description: |
        Public endpoint. Subject to per-IP throttling (see §12.3).

        For users who have completed MFA enrollment, the 200 body short-
        circuits to an `MfaLoginChallenge` (`mfa_required: true`) instead
        of a `TokenPair`. Client must follow with `POST /v1/auth/login/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Credentials accepted. Body is either a TokenPair OR an MFA challenge.
          content:
            application/json:
              schema:
                # Inlined to match the FastAPI emission of the
                # Annotated[TokenPair | MfaLoginChallenge, discriminator='kind']
                # response_model — FastAPI does not produce a top-level $ref
                # for discriminated unions, so referencing #/LoginResponse here
                # would drift from the generated spec. The LoginResponse
                # schema is retained under components/schemas as documentation.
                oneOf:
                  - { $ref: '#/components/schemas/TokenPair' }
                  - { $ref: '#/components/schemas/MfaLoginChallenge' }
                discriminator:
                  propertyName: kind
                  mapping:
                    token_pair:   '#/components/schemas/TokenPair'
                    mfa_required: '#/components/schemas/MfaLoginChallenge'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/Validation' }
        "429": { $ref: '#/components/responses/RateLimited' }

  /v1/auth/login/verify:
    post:
      tags: [auth]
      operationId: auth_login_verify
      security: []
      summary: Complete an MFA login challenge. Returns the TokenPair on success.
      description: |
        The `mfa_challenge_id` IS the auth context — this endpoint takes
        no bearer token. Single-use: the challenge row is consumed on
        success and rejected on replay. 5 failed verifies in 15 minutes
        silently lock the user via the same 401 surface as a wrong code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaLoginVerifyRequest' }
      responses:
        "200":
          description: MFA accepted; new JWT pair issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/Validation' }
        "429": { $ref: '#/components/responses/RateLimited' }

  /v1/auth/mfa/enroll:
    post:
      tags: [auth]
      operationId: auth_mfa_enroll
      summary: Mint a fresh TOTP secret. Not persisted until /verify-enroll confirms.
      description: |
        Returns the `otpauth://` URI for QR-code rendering AND the raw
        `secret_b32`. The client MUST echo `secret_b32` back in the
        following `POST /v1/auth/mfa/verify-enroll` request — the server
        does not stage it.
      responses:
        "200":
          description: TOTP secret minted (transient).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/mfa/verify-enroll:
    post:
      tags: [auth]
      operationId: auth_mfa_verify_enroll
      summary: Confirm enrollment by proving you can produce a code from the secret.
      description: |
        On success, the encrypted secret is written to `system_user_credential`
        and the user is MFA-enrolled. A wrong code persists nothing — the
        user can rerun `/enroll` cleanly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyEnrollRequest' }
      responses:
        "204": { description: MFA secret persisted; user is now enrolled. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/Validation' }

  /v1/auth/mfa:
    delete:
      tags: [auth]
      operationId: auth_mfa_disable
      summary: Disable MFA after primary-factor (password) re-auth.
      description: |
        Requires both a valid bearer token AND `current_password` in the
        body — defeats "attacker steals laptop, leaves MFA off via the
        stolen session alone."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaDisableRequest' }
      responses:
        "204": { description: MFA disabled; user reverts to single-factor login. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/Validation' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: auth_refresh
      security: []
      summary: Exchange a refresh token for a fresh JWT pair.
      description: |
        Rotates the refresh token: the old row is revoked with `replaced_by`
        pointing at the new row, and a fresh access + refresh pair is
        returned. The previously presented refresh secret is single-use —
        replays land on the revoked row and are rejected with 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "200":
          description: New JWT pair issued; old refresh secret is now revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/Validation' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: auth_logout
      summary: Revoke the current refresh token and denylist the access jti.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        "204": { description: Logged out. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/Validation' }

  /v1/auth/me:
    get:
      tags: [auth]
      operationId: auth_me
      summary: Return the authenticated SystemUser and currently-granted scopes.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMe' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/tokens:
    get:
      tags: [auth]
      operationId: auth_list_tokens
      summary: List the caller's own active Personal Access Tokens.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeTotal' }
      responses:
        "200":
          description: Cursor page of PAT summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPagePATSummary' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [auth]
      operationId: auth_mint_token
      summary: Mint a new Personal Access Token. Secret is returned ONCE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PATMintRequest' }
      responses:
        "201":
          description: PAT minted. Secret is plaintext only in this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PATMinted' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/Validation' }

  /v1/auth/tokens/{token_id}:
    delete:
      tags: [auth]
      operationId: auth_revoke_token
      summary: Revoke a PAT belonging to the caller (or any user with admin:tokens).
      parameters:
        - { $ref: '#/components/parameters/TokenIdPath' }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/auth/stream-token:
    post:
      tags: [auth]
      operationId: auth_mint_stream_token
      summary: Mint a short-lived (≤15 min) bearer token usable in the SSE query string.
      description: Browser SSE fallback path. See API_PLAN §6.4.2.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamTokenRequest' }
      responses:
        "200":
          description: Stream token minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamTokenMinted' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/Validation' }

  /v1/auth/signing-key/challenge:
    post:
      tags: [auth]
      operationId: auth_signing_key_challenge
      summary: Mint a single-use proof-of-possession challenge for signing-key registration.
      description: |
        PHASE-4 self-service. The authenticated operator requests a short-lived
        (60s), single-use, user-bound nonce, signs
        `EYENET-SIGNING-KEY-CHALLENGE-v1(nonce, public_key)` with the candidate
        Ed25519 private key, and submits the signature to
        `POST /v1/auth/signing-key`. No special scope — the bearer identity is
        the authorization (like MFA enroll).
      responses:
        "200":
          description: Challenge minted (transient, single-use).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKeyChallengeResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/signing-key:
    post:
      tags: [auth]
      operationId: auth_register_signing_key
      summary: Register an operator verifying key by proving possession of the private key.
      description: |
        PHASE-4 self-service registration (no admin-override). Verifies the
        proof-of-possession signature against the SUBMITTED key, then atomically
        consumes the user-bound challenge nonce, then records the key — rotating
        and retiring any prior active key (one-active invariant). A failed proof
        or an unusable (replayed/expired/unknown/wrong-user) nonce returns 401
        and registers nothing; malformed key/signature material is rejected as
        422 at the schema boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SigningKeyRegisterRequest' }
      responses:
        "200":
          description: Key registered and now active; prior active key retired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKeyRegisterResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/Validation' }

  # ────────────────────────────────────────────────────────────────────────
  # 3.2 Reads
  # ────────────────────────────────────────────────────────────────────────
  /v1/actors/{actor_id}:
    get:
      tags: [actors]
      operationId: actors_get
      summary: Get an actor by id. Emits one `evidence_access` audit row.
      parameters:
        - { $ref: '#/components/parameters/ActorIdPath' }
      responses:
        "200":
          description: Actor detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/actors/{actor_id}/neighbors:
    get:
      tags: [actors]
      operationId: actors_neighbors
      summary: List graph neighbors of an actor (typed-edge discriminated union).
      parameters:
        - { $ref: '#/components/parameters/ActorIdPath' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeTotal' }
      responses:
        "200":
          description: Cursor page of typed neighbor edges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/actors/{actor_id}/observations:
    get:
      tags: [actors]
      operationId: actors_observations
      summary: List observations attributable to an actor.
      parameters:
        - { $ref: '#/components/parameters/ActorIdPath' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeTotal' }
        - { $ref: '#/components/parameters/SinceTs' }
        - { $ref: '#/components/parameters/UntilTs' }
      responses:
        "200":
          description: Cursor page of observation summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPageObservationSummary' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/actors/{actor_id}/timeline:
    get:
      tags: [actors]
      operationId: actors_timeline
      summary: Time-ordered messages and observations for an actor.
      parameters:
        - { $ref: '#/components/parameters/ActorIdPath' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeTotal' }
        - { $ref: '#/components/parameters/SinceTs' }
        - { $ref: '#/components/parameters/UntilTs' }
      responses:
        "200":
          description: Cursor page of timeline entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPageTimelineEntry' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/personas/{persona_id}:
    get:
      tags: [personas]
      operationId: personas_get
      summary: Get a persona by id.
      parameters:
        - { $ref: '#/components/parameters/PersonaIdPath' }
      responses:
        "200":
          description: Persona detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/personas/{persona_id}/members:
    get:
      tags: [personas]
      operationId: personas_members
      summary: List members (actors belonging to this persona).
      parameters:
        - { $ref: '#/components/parameters/PersonaIdPath' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeTotal' }
      responses:
        "200":
          description: Cursor page of persona members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPagePersonaMember' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/personas/{persona_id}/merge:
    post:
      tags: [personas]
      operationId: personas_merge
      summary: Operator merge — fold another persona in. Publishes `attribution.persona.merge`.
      parameters:
        - { $ref: '#/components/parameters/PersonaIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaMergeRequest' }
      responses:
        "202": { $ref: '#/components/responses/WriteAcceptedResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/Validation' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/personas/{persona_id}/split:
    post:
      tags: [personas]
      operationId: personas_split
      summary: Operator split — pull one actor out. Publishes `attribution.persona.split`.
      parameters:
        - { $ref: '#/components/parameters/PersonaIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaSplitRequest' }
      responses:
        "202": { $ref: '#/components/responses/WriteAcceptedResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/Validation' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/linkages:
    get:
      tags: [linkages]
      operationId: linkages_list
      summary: List linkages. Index read — does not audit.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeTotal' }
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LinkageState' }
        - name: method
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - { $ref: '#/components/parameters/SinceTs' }
        - { $ref: '#/components/parameters/UntilTs' }
      responses:
        "200":
          description: Cursor page of linkages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPageLinkageSummary' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/Validation' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/linkages/{linkage_id}:
    get:
      tags: [linkages]
      operationId: linkages_get
      summary: Get linkage detail with comparator evidence.
      parameters:
        - { $ref: '#/components/parameters/LinkageIdPath' }
      responses:
        "200":
          description: Linkage detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkageDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/graph/stats:
    get:
      tags: [graph]
      operationId: graph_stats
      summary: Aggregate counts. No per-entity dereference; no evidence audit.
      responses:
        "200":
          description: Graph statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphStats' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/graph/search:
    get:
      tags: [graph]
      operationId: graph_search
      summary: Search actors by handle/alias/identifier.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeTotal' }
      responses:
        "200":
          description: Cursor page of matching actor summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPageActorSummary' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/Validation' }
        "503": { $ref: '#/components/responses/Unavailable' }

  # ────────────────────────────────────────────────────────────────────────
  # 3.3 Audit
  # ────────────────────────────────────────────────────────────────────────
  /v1/audit:
    get:
      tags: [audit]
      operationId: audit_list
      summary: List audit rows. Reading audit does NOT emit a new audit row.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeTotal' }
        - { $ref: '#/components/parameters/SinceTs' }
        - { $ref: '#/components/parameters/UntilTs' }
        - name: user
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: subject
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Cursor page of audit rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursorPageAuditRow' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/Validation' }
        "503": { $ref: '#/components/responses/Unavailable' }

  /v1/audit/verify:
    get:
      tags: [audit]
      operationId: audit_verify
      summary: Recompute the audit hash chain and return the first break (if any).
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditVerifyResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/Unavailable' }

  # ────────────────────────────────────────────────────────────────────────
  # 3.4 Writes
  # ────────────────────────────────────────────────────────────────────────
  /v1/linkages/{linkage_id}/confirm:
