[project]
name = "eyenet"
version = "0.0.0"
description = "Observation framework for forensic analysis of threat actors. Sibling of DECNET, consumer of BEHAVE-TEXT."
readme = "PLAN.md"
requires-python = ">=3.12"
authors = [{ name = "ANTI" }]
license = { text = "Proprietary" }

dependencies = [
  # core
  "pydantic>=2.7",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0",

  # storage
  "sqlite-vec>=0.1.6",

  # bus
  "nats-py>=2.7",

  # collectors (telegram first)
  "telethon>=1.36",
  "tgcrypto>=1.2",          # MTProto AES-IGE acceleration for telethon

  # http api (graph query + operator surface)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",            # used by fastapi TestClient and any outbound http

  # telemetry
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "structlog>=24.1",

  # crypto / opsec
  "cryptography>=43",

  # cli
  "typer>=0.12",
  "rich>=13.7",

  # ids
  "uuid7>=0.1",
]

[project.optional-dependencies]
dev = [
  # runtime test
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "pytest-timeout>=2.3",
  "pytest-randomly>=3.15",
  "pytest-benchmark>=4",
  "hypothesis>=6.108",
  "hypothesis-jsonschema>=0.23",
  "syrupy>=4.6",
  "polyfactory>=2.16",
  "dirty-equals>=0.8",
  "freezegun>=1.5",
  "respx>=0.21",
  "testcontainers[nats]>=4.7",

  # load
  "locust>=2.31",

  # static / sec
  "mypy>=1.11",
  "ruff>=0.6",
  "bandit[toml]>=1.7",
  "deptry>=0.20",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
]

deferred = [
  # earned when Graph API has OpenAPI
  "schemathesis>=3.34",
  # earned when primitive suite is stable
  "mutmut>=2.5",
]

[project.scripts]
eyenet = "eyenet.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyenet"]

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  # speed (exactly one per test)
  "unit: fast, no I/O, no network, no DB. Default selection.",
  "integration: in-memory bus, in-memory or temp-file SQLite. No external processes.",
  "e2e: spawns real NATS / real services via testcontainers. Slow.",
  # category (zero or more)
  "contract: CDD contract test. Property-based or schema round-trip.",
  "calibration: stylometric AUC / discrimination tests. Needs labeled corpus.",
  "benchmark: pytest-benchmark perf assertion.",
  "schema: schemathesis HTTP API fuzzing. Needs running service.",
  "load: locust load test (run via locust CLI, not pytest).",
  "slow: tests over 5s wall-clock. Catch-all for opt-in.",
  "primitive: belongs to the BEHAVE-TEXT primitive suite.",
  "telegram: requires Telegram fixture / TDLib bind. Skipped without env flag.",
  "needs_pool: requires identity-pool fixture. Skipped without env flag.",
]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-m", "unit or contract",
  "--cov=eyenet",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
  "--timeout=30",
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["eyenet"]
omit = [
  "eyenet/cli/__main__.py",
  "tests/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
fail_under = 95

# -----------------------------------------------------------------------------
# Ruff (strict)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures/snapshots"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",            # pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "N",            # pep8-naming
  "C4",           # comprehensions
  "SIM",          # simplify
  "RET",          # return
  "ARG",          # unused args
  "PL",           # pylint
  "PT",           # pytest style
  "PTH",          # use pathlib
  "ERA",          # commented-out code
  "TID",          # tidy imports
  "TCH",          # type-checking imports
  "RUF",          # ruff-specific
  "S",            # bandit-lite (security)
  "A",            # builtins shadow
  "ANN",          # annotations
  "ASYNC",        # async issues
  "DTZ",          # datetime tz awareness — ALL timestamps must be tz-aware
]
ignore = [
  "ANN401",       # Any in **kwargs ok
  "PLR0913",      # too many args — design constraint, not a smell
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",         # asserts in tests
  "ANN",          # don't require annotations in tests
  "PLR2004",      # magic numbers in tests
  "ARG",          # unused args (fixtures)
]
"eyenet/cli/**/*.py" = ["T20"]   # print is fine in CLI

[tool.ruff.lint.isort]
known-first-party = ["eyenet"]
combine-as-imports = true

# -----------------------------------------------------------------------------
# MyPy (strict)
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["telethon.*", "sqlite_vec.*", "uuid7.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------------------------
# Bandit
# -----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".githooks"]
skips = ["B101"]  # assert is fine; we use it in tests + Pydantic invariants

# -----------------------------------------------------------------------------
# Deptry
# -----------------------------------------------------------------------------
[tool.deptry]
known_first_party = ["eyenet"]
extend_exclude = ["tests", "scripts"]
# TODO(M1): re-enable DEP002. The bootstrap commit declares the full
# runtime dep set but does not import any of it yet. Once services start
# landing in Milestone 1, drop this ignore so unused deps get caught.
ignore = ["DEP002"]
