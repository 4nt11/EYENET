# EYENET — sample OpenTelemetry Collector config (API_PLAN §11.6).
#
# The API does HEAD sampling = ParentBased(ALWAYS_ON): it keeps every span it
# sees. The real cost control is TAIL sampling here at the collector, which is
# the only place that can decide "keep this trace because it LATER emitted
# attribution.linkage.proposed or errored" — a head sampler cannot know the
# future. Mirrors eyenet/telemetry/sampling.py:should_keep_trace.
#
# Point the API at this collector with EYENET_OTEL_ENDPOINT=http://<host>:4317.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  # Tail every container's json-file logs and ship them to Loki. Precondition:
  # services emit SINGLE-LINE JSON (eyenet/telemetry/logging.py) so each line is
  # one clean record. Needs /var/lib/docker/containers mounted + the collector
  # running as root (see compose.yaml otel-collector). start_at:end avoids
  # re-reading history on first boot; a restart may re-ship the open file's tail
  # (no persistent checkpoint, deliberately — minor dup beats another volume).
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    operators:
      # 1. The `container` operator parses the Docker json-file wrapper, moves the
      #    message into `body`, sets the timestamp, and recombines Docker's 16KB
      #    line-splits. Doing this by hand with json_parser chokes on the split
      #    continuation lines (invalid '\' / unexpected end of JSON).
      - type: container
        format: docker
        # Single host, no k8s — skip pod/namespace extraction from the file path
        # (it needs include_file_path and otherwise fails with a nil path field).
        add_metadata_from_filepath: false
      # 2. Our app lines are single-line JSON (telemetry/logging.py) — parse them.
      #    Non-JSON infra lines (postgres/nats/caddy) fail the guard and pass through
      #    untouched as a plain body.
      - type: json_parser
        parse_from: body
        if: 'body matches "^\\s*[{]"'
      # 3. structlog `event` text becomes the log body.
      - type: move
        from: attributes.event
        to: body
        if: 'attributes.event != nil'
      # 4. structlog `level` -> OTel severity.
      - type: severity_parser
        parse_from: attributes.level
        if: 'attributes.level != nil'

processors:
  # tail_sampling buffers each trace until decision_wait, then applies policies
  # top-to-bottom; first match wins.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      # Always keep anything that errored.
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Always keep operator panic writes and auth failures (§11.6).
      - name: panic-and-auth-failures
        type: string_attribute
        string_attribute:
          key: eyenet.subject
          values:
            - "eyenet.control.panic"
            - "eyenet.audit.auth.login.failure"
          enabled_regex_matching: true
      # Always keep the linkage-proposed lineage (the trace worth reading).
      - name: linkage-proposed
        type: string_attribute
        string_attribute:
          key: eyenet.subject
          values: ["attribution\\.linkage\\.proposed"]
          enabled_regex_matching: true
      # Always keep every collector-supervisor event (the fleet heartbeat — spawn,
      # crash, backfill, join decisions all carry eyenet.keep=supervisor).
      - name: keep-supervisor
        type: string_attribute
        string_attribute:
          key: eyenet.keep
          values: ["supervisor"]
      # Always keep slow traces — the ones worth debugging. Matches the dashboard's
      # "Slow traces (> 1s)" panel and guarantees a latency outlier is never sampled
      # away. First-match-wins, so this must sit before the probabilistic default.
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      # Everything else: keep 10%.
      - name: default-10pct
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  # Promote the structlog `service` attribute to a resource attribute so Loki
  # turns it into a stream label (query `{service_name="linker"}` in Grafana).
  transform/logs:
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], attributes["service"]) where attributes["service"] != nil
  batch: {}

exporters:
  # Traces → any OTLP backend (Jaeger, Tempo, Honeycomb, …).
  otlp/traces:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Metrics → Prometheus (scraped by Prometheus at :8889). Carries BOTH the OTel
  # metrics the services emit directly AND the span-derived RED + service-graph
  # metrics from the connectors below. Operators on plain Prometheus can skip this
  # and scrape only the API's /v1/metrics.
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep resource attributes (service.name etc.) as labels so dashboards can
    # template by service; don't let the exporter drop them.
    resource_to_telemetry_conversion:
      enabled: true
  # Logs → Loki's native OTLP endpoint. Loki promotes service.name to a stream
  # label; trace_id/span_id ride as structured metadata (Grafana derived field
  # links them to Tempo). See deploy/docker/observability/loki.yaml.
  otlphttp/logs:
    logs_endpoint: http://loki:3100/otlp/v1/logs

# Connectors turn the trace stream into metrics. They are fed from a PRE-sampling
# traces branch (see service.pipelines) so RED/service-graph counts reflect ALL
# spans, not the ~10% tail_sampling keeps for Tempo.
connectors:
  # RED metrics per span: eyenet_spans_calls_total + eyenet_spans_duration_milliseconds_*
  # labelled by service_name, span_name, span_kind, status_code (+ eyenet.subject).
  spanmetrics:
    namespace: eyenet_spans
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: eyenet.subject
    metrics_flush_interval: 15s
  # Edge metrics for the service map: traces_service_graph_request_* labelled by
  # client/server. Grafana's Tempo "Service Graph" renders the node graph from these.
  servicegraph:
    latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 1s, 5s, 30s]
    store:
      ttl: 5s
      max_items: 2000

service:
  pipelines:
    # Sampled traces → Tempo (the subset worth storing/reading).
    traces/tempo:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp/traces]
    # ALL traces → the connectors, BEFORE sampling, so metrics are complete.
    traces/metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [spanmetrics, servicegraph]
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [batch]
      exporters: [prometheus]
    # Container logs → Loki. The pipeline you open Grafana to read instead of SSHing
    # in. filelog tails json-file logs; transform labels them by service.
    logs:
      receivers: [filelog]
      processors: [transform/logs, batch]
      exporters: [otlphttp/logs]
