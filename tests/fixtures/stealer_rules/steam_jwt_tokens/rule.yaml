id: steam_jwt_tokens
version: 1
layer: content
family: steam_tokens
priority: 90
path_glob: steam_tokens.txt
description: >
  Steam JWT tuple parity fixture. Verifies the header-comment +
  '<login>.<jwt>' two-line record decomposes into four structured
  fields: login, SteamID, persona, and the three-segment JWT.
match:
  type: regex
  pattern: '(?m)^#\s*(?P<steam_login>\S+)\s*\|\s*SteamID:\s*(?P<steam_id>\d+)\s*\|\s*Persona:\s*(?P<steam_persona>[^\n\r]+?)\s*\r?\n[^\s.]+\.(?P<steam_jwt>[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)$'
extract:
  fields: [steam_login, steam_id, steam_persona, steam_jwt]
