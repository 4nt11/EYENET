<!-- @dsCard group="Colors" viewport="700x150" name="Base & Surfaces" subtitle="Pure black + near-black layering surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--black);padding:16px;font-family:var(--font-mono)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{border:1px solid var(--border);border-radius:4px;overflow:hidden}
.chip{height:64px}
.meta{padding:6px 8px;background:var(--surface);border-top:1px solid var(--border)}
.name{font-size:11px;color:var(--text);letter-spacing:.02em}
.val{font-size:10px;color:var(--text-faint);margin-top:2px}</style></head>
<body><div class="grid">
<div class="sw"><div class="chip" style="background:#000"></div><div class="meta"><div class="name">--black</div><div class="val">#000000</div></div></div>
<div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="meta"><div class="name">--surface</div><div class="val">#0c0d10</div></div></div>
<div class="sw"><div class="chip" style="background:var(--panel)"></div><div class="meta"><div class="name">--panel</div><div class="val">#141519</div></div></div>
<div class="sw"><div class="chip" style="background:var(--panel-2)"></div><div class="meta"><div class="name">--panel-2</div><div class="val">#1a1c21</div></div></div>
<div class="sw"><div class="chip" style="background:var(--border-strong)"></div><div class="meta"><div class="name">--border</div><div class="val">#24262b</div></div></div>
</div></body></html>
