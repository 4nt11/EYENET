id: passwords_block_browser
version: 1
layer: content
family: browser_passwords
priority: 80
path_glob: "**/*.txt"
description: >
  'Browser:'-prefixed block passwords.txt format. Six-line records
  separated by blank lines. Richer than the title/upper variants:
  carries the exact browser version string, the profile name, and
  the capture timestamp alongside Url/Login/Password.

  Observed in Khazan sample 10927 (Edge 151.0.4129.72 harvest),
  smells like modern Lumma / Meduza / newer Vidar builds that
  emit per-record metadata. Fires in parallel with the three
  sibling block rules; whichever anchor matches wins.

  Record shape:
    Browser: <name version>
    Url: <full url>
    Login: <email-or-username>
    Password: <plaintext>
    Profile: <browser profile name>
    Date: <DD.MM.YYYY, HH:MM:SS local time, no tz>

  Date is left un-normalized because the DD.MM.YYYY format is not
  one of our date_parse recognisers and locale-anchored dates are
  easier to triage with the raw string anyway.
match:
  type: regex
  pattern: 'Browser:\s*(?P<browser>[^\n]*)\nUrl:\s*(?P<url>[^\n]*)\nLogin:\s*(?P<login>[^\n]*)\nPassword:\s*(?P<password>[^\n]*)\nProfile:\s*(?P<profile>[^\n]*)\nDate:\s*(?P<captured_at>[^\n]*)'
extract:
  fields: [browser, url, login, password, profile, captured_at]
ttps:
  - T1555.003
