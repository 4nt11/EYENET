notes: >
  v1 died with the 2022 arrest of the primary operator. v2 (sometimes
  called RecordBreaker) appeared mid-2022 and continued through 2024.
  Both v1 and v2 ship System.txt and collide with Lumma on filename;
  tiebreak is HWID shape (Raccoon: 32-hex; Lumma: UUID-style) and
  the per-browser-profile directory layout (Raccoon writes
  Browsers/<Browser>/<Profile>_pws.txt, Lumma writes
  Chrome/<Profile>/Passwords.txt).
