id: json_v2_log_info
version: 1
layer: content
family: json_v2
priority: 110
path_glob: log_info.json
description: >
  Exfil manifest metadata. Priority 110 (above pc_info at 100) so
  counts + CreatedOnUtc override anything of the same name from
  pc_info. BuildID observed in some sub-variants but NOT in Khazan
  intake (2026-11), so required key is now CreatedOnUtc which is
  universal across StealC v2 / Acreed / Stealerium builds seen so
  far. IsHaveGrabberFiles is the signal that the drop ships the Gabb
  file-grabber sidecar: integer > 0 = present, 0 = absent.
match:
  type: json
  requires_keys:
    - CreatedOnUtc
extract:
  paths:
    build_id: $.BuildID
    is_duplicate: $.IsDuplicate
    browser_count: $.BrowserCount
    cookie_count: $.CookiesCount
    wallet_count: $.WalletCount
    wallet_ext_count: $.ExtensionsWalletCount
    password_count: $.PasswordsCount
    form_count: $.FormsCount
    credit_card_count: $.CreditCardsCount
    pm_ext_count: $.PMExtCount
    messengers: $.Messengers
    grabber_bytes: $.IsHaveGrabberFiles
    exfil_at: $.CreatedOnUtc
normalize:
  - { verb: date_parse, field: exfil_at, format: iso8601 }
ttps:
  - T1082
