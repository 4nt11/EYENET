aliases: [credentials-windows, DPAPI-credentials]
signature_files:
  - CredentialsWindows.txt
loaders: []
distribution_channels:
  - inside stealer-log drops (anything that calls CredEnumerate + DPAPI unwrap)
references:
  - title: Windows Credential Manager (Microsoft Learn)
    url: https://learn.microsoft.com/en-us/windows/win32/secauthn/credential-manager
  - title: DPAPI master key extraction (SharpDPAPI)
    url: https://github.com/GhostPack/SharpDPAPI
notes: >
  Export of the victim's Windows Credential Manager (DPAPI-unwrapped).
  Covers: domain credentials, Microsoft account tokens, OneDrive
  refresh tokens, Xbox Live auth (seen with 'Target: MCLMS|...' +
  base64 JWT in the Pass field), stored credentials for mapped
  network drives, mstsc RDP saved creds, Outlook / Thunderbird SMTP
  passwords, and anything a victim app wrote via CredWrite().

  Dominant shape:
    Target: <credential-target-name>
    User: <username or N/A>
    Pass: <base64 blob OR plaintext password>
    <blank line>

  High-value evidence; the Pass field often holds long base64/JWT
  tokens and passwords should be treated as plaintext even when they
  look like garbage (they frequently are OAuth refresh tokens).
