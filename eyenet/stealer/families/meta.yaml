slug: meta
name: Meta Stealer
status: retired
kind: stealer
schema: 2
first_seen_year: 2022
aliases: [Meta, MetaStealer]
signature_files:
  - UserInformation.txt
signature_rule_ids:
  - processes_plain_exe
  - software_installed_list
  - passwords_block_title
antisignature_files:
  - pc_info.json
  - log_info.json
  - information.txt
antisignature_rule_ids:
  - stealer_info_yaml
  - environment_windows
# Meta forked from RedLine; the file layouts overlap enough that without
# the stealer_info_yaml / environment_windows anti-signals they tie.
# Floor is a notch higher so a weak match defers to no-verdict instead
# of an uncertain Meta or RedLine pick.
confidence_floor: 0.45
loaders:
  - SmokeLoader
  - PrivateLoader
distribution_channels:
  - Russian forums
references:
  - title: Europol Operation Magnus (Oct 2024, RedLine + Meta takedown)
    url: https://www.europol.europa.eu/media-press/newsroom/
  - title: Flashpoint Meta Stealer profile
    url: https://flashpoint.io/blog/meta-stealer/
notes: >
  Direct RedLine fork that reused most of the UserInformation.txt
  surface. Taken down alongside RedLine in Operation Magnus (Oct 2024).
  Log dumps from early 2024 and prior still circulate; new infections
  effectively zero. Our redline_container rule will also match Meta
  samples by filename; a disambiguating rule off the actor-handle
  string inside UserInformation.txt is a possible follow-up.
