# EYENET Alembic config — DEV autogenerate workflow only.
#
# The application does NOT read this file: it boots the schema via
# eyenet.storage.sqlite_repo.database.upgrade_to_head(), which builds an
# in-code Config and injects both engines. This ini exists so a developer can
# run, from the repo root:
#
#   alembic revision --autogenerate -m "add foo" -x data_dir=data
#   alembic upgrade head -x data_dir=data
#
# No sqlalchemy.url here on purpose — env.py builds the main + audit engines
# (from -x data_dir=<path>, default ./data) so the two-database layout and the
# shared-cache in-memory engines both work through one code path.

[alembic]
script_location = eyenet/storage/sqlite_repo/migrations
prepend_sys_path = .
path_separator = os
# Revision filenames: NNNN_slug.py, matching the hand-written baseline.
file_template = %%(rev)s_%%(slug)s
