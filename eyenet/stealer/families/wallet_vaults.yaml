slug: wallet_vaults
name: Browser-extension wallet vaults (LevelDB-extracted)
status: active
first_seen_year: 2020
aliases: [metamask, phantom, ronin, trust-wallet, browser-wallets]
signature_files:
  - Local Extension Settings/nkbihfbeogaeaoehlefnkodbefgpgknn
  - Local Extension Settings/bfnaelmomeimhlpmgjnjophhpkkoljpa
  - Local Extension Settings/fnjhmkhhmkbjkkabndcnnogagogbneec
  - IndexedDB/chrome-extension_*_0.indexeddb.leveldb
loaders: []
distribution_channels:
  - every Chromium-family stealer walks the User Data profile for
