# Minimal single-binary Tempo — trace sink for the OTel collector (local storage).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Explicit trace retention (matches Tempo's own default, pinned so a version bump
# can't change it silently). The compactor deletes blocks older than this.
compactor:
  compaction:
    block_retention: 336h  # 14 days
