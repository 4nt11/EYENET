references:
  - title: Chromium Login Data format (sqlite3 source)
    url: https://chromium.googlesource.com/chromium/src/+/HEAD/components/password_manager/core/browser/
notes: >
  Meta-family for the plain-text password dumps every stealer ships.
  Three distinct block shapes seen in Khazan intake:

    A. Title-case + blank-line separator: Soft / Host / Login / Password
       (402 of 439 victims; StealC v1, Lumma, Opus, most others)
    B. UPPERCASE + blank-line separator: SOFT / URL / USER / PASS
       (37 victims; json_v2 cluster = StealC v2 / Acreed / Stealerium)
    C. Title-case + '===============' divider: URL / Username / Password
       (RedLine Passwords.txt)

  Variants A + B may include android://hash@pkg/ URLs in the host slot
  when the credential came from a mobile app login. All three shapes
  may contain empty Login / USER values and empty Password / PASS
  values (stealer captured the record anyway).
