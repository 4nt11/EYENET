notes: >
  Newly discovered family. Info.txt is YAML-shaped (not INI, not plain
  keyvalue), which is unusual in this ecosystem and was the hinge that
  led us to add YAML support to the rule engine. Observed in Khazan
  intake with ~57 folders carrying the YAML Info.txt. Dead-drop
  resolver (DDR) technique for C2 fetch. No rules in our catalog yet;
  add when we see enough samples to characterize the output shape
  stably across builds.
