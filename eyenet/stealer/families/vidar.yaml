notes: >
  Forked from Arkei, which in turn forked from an earlier commodity
  codebase. StealC is a Vidar clone and reuses the same output
  surface (information.txt). In practice, repackers normalize these
  so hard that single-folder disambiguation fails; our stealc_container
  rule tags them stealc_or_vidar when the banner dominates and leaves
  Vidar-specific disambiguation to a wallet-dir probe (not yet built).
  Vidar 10.x shipped 2025; 2026 builds in wild.
