id: passwords_tsv
version: 1
layer: content
family: json_v2
priority: 50
path_glob: passwords.tsv
description: >
  Per-victim TSV credentials file shipped by the json_v2 cluster (StealC
  v2 / Acreed / Stealerium). Tab-separated `url \t username \t password`
  per line. This rule only captures the FIRST row as a sample (the
  DELIMITER matcher is single-row by design); the pipeline's ulpextract
  pass remains the authoritative credential ingester for the full file.
  Here it serves as a sanity probe that the archive is well-formed
  before a victim dossier is committed.
match:
  type: delimiter
  separator: "\t"
  min_columns: 3
  skip_blank: true
extract:
  columns:
    0: sample_url
    1: sample_user
    2: sample_password
ttps:
  - T1555.003
