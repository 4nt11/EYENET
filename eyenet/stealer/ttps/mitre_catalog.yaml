# MITRE ATT&CK technique catalog used by the stealer-rule TTP tags.
#
# Only the techniques REFERENCED by one or more rules live here. Not a
# full ATT&CK mirror. Regenerate semi-annually against the ATT&CK STIX
# feed (https://github.com/mitre/cti) if MITRE renames a tactic or
# retires a technique; IDs are stable across versions.
#
# Scope note: a follow-up API endpoint may expose /v1/stealer/search?q=T1528
# returning the artifacts / files whose rules carry that technique. Keep
# the catalog + rule YAML the single source of truth so that endpoint
# resolves reliably.
#
# Field contract per technique:
#   name      ATT&CK technique display name
#   tactic    tactic display name (one of 14)
#   tactic_id ATT&CK tactic ID (TA0001 .. TA0043 range)
#   url       canonical ATT&CK technique URL

techniques:
