<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--black);padding:20px;font-family:var(--font-mono)}
.row{display:flex;align-items:flex-end;gap:14px}
.cell{display:flex;flex-direction:column;gap:6px;align-items:center}
.bar{background:var(--accent);border-radius:2px;width:22px}
.n{font-size:10px;color:var(--text-muted)}.v{font-size:10px;color:var(--text-faint)}</style></head>
<body><div class="row">
<div class="cell"><div class="bar" style="height:4px"></div><div class="n">2</div><div class="v">2px</div></div>
<div class="cell"><div class="bar" style="height:8px"></div><div class="n">3</div><div class="v">8px</div></div>
<div class="cell"><div class="bar" style="height:12px"></div><div class="n">4</div><div class="v">12px</div></div>
<div class="cell"><div class="bar" style="height:16px"></div><div class="n">5</div><div class="v">16px</div></div>
<div class="cell"><div class="bar" style="height:20px"></div><div class="n">6</div><div class="v">20px</div></div>
<div class="cell"><div class="bar" style="height:24px"></div><div class="n">7</div><div class="v">24px</div></div>
<div class="cell"><div class="bar" style="height:32px"></div><div class="n">8</div><div class="v">32px</div></div>
<div class="cell"><div class="bar" style="height:40px"></div><div class="n">9</div><div class="v">40px</div></div>
<div class="cell"><div class="bar" style="height:48px"></div><div class="n">10</div><div class="v">48px</div></div>
</div></body></html>
