[project]
name = "eyenet"
version = "0.0.0"
description = "Observation framework for forensic analysis of threat actors. Sibling of DECNET, consumer of BEHAVE-TEXT."
readme = "PLAN.md"
requires-python = ">=3.12"
authors = [{ name = "ANTI" }]
license = { text = "Proprietary" }

dependencies = [
  # core
  "pydantic>=2.7",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0",

  # storage
  "sqlite-vec>=0.1.6",

  # bus
  "nats-py>=2.7",

  # collectors (telegram first)
  "telethon>=1.36",
  "tgcrypto>=1.2",          # MTProto AES-IGE acceleration for telethon
  "PySocks>=1.7",            # socks proxy support; transitive from telethon, imported directly
  # Matrix collector. [e2e] pulls python-olm (libolm bindings) for Megolm
  # decryption + persistent device store. Operator must have libolm
  # installed system-wide (apt: libolm-dev, dnf: libolm-devel, brew: libolm).
  "matrix-nio[e2e]>=0.24",

  # http api (graph query + operator surface)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",            # used by fastapi TestClient and any outbound http

  # telemetry
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "opentelemetry-exporter-prometheus>=0.48b0",  # M9.6 /v1/metrics scrape (pulls prometheus_client)
  "structlog>=24.1",

  # crypto / opsec
  "cryptography>=43",
  "argon2-cffi>=23.1",      # M9.A2 password hashing
  "pyjwt[crypto]>=2.8",     # M9.A2 RS256 JWT sign/verify (crypto extra → cryptography backend)
  "cachetools>=5.3",        # M9.A2 auth resolver TTL cache
  "types-cachetools>=5.5",  # type stubs for the above
  "pyotp>=2.9",             # M9.A3 TOTP RFC 6238

  # domain normalization — IDNA2008 + UTS46 (stdlib codec is IDNA2003 only,
  # silently NFKC-folds adversarial input and defeats homograph defense).
  "idna>=3.7",

  # cli
  "typer>=0.12",
  "rich>=13.7",

  # ids
  "uuid7>=0.1",

  # behave (sibling specs — now published on PyPI; resolved like any other dep)
  "behave-core>=0.1.1",
  "behave-text>=0.1.3",

  # nlp (locale-aware primitives — M6.5 spaCy trio).
  # Core dep, not optional: EYENET ships small-operator CTI; operators
  # accept the storage cost in exchange for working software out of the box.
  # The es_core_news_sm model (~13MB) is auto-fetched on first run by
  # eyenet/sensor/primitives/_locale_morph_kernel.py.
  "spacy>=3.7,<4.0",

  # classifier — regex ruleset spine (M10 slice 3). RE2 is a linear-time,
  # ReDoS-immune engine: the classifier matches operator-editable rules over
  # threat-actor-authored text, where a backtracking engine is a DoS vector.
  # Runs in the main app (consumes already-extracted text), so it is a core dep,
  # not a jail-only extract dep. Imports as `re2`.
  "google-re2>=1.1",
]

[project.optional-dependencies]
dev = [
  # runtime test
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "pytest-timeout>=2.3",
  "pytest-randomly>=3.15",
  "pytest-benchmark>=4",
  "hypothesis>=6.108",
  "hypothesis-jsonschema>=0.23",
  "syrupy>=4.6",
  "polyfactory>=2.16",
  "dirty-equals>=0.8",
  "freezegun>=1.5",
  "respx>=0.21",
  "testcontainers[nats]>=4.7",
  "pyyaml>=6",  # M9.6: validate operations/ alert + collector YAML artifacts

  # load
  "locust>=2.31",

  # static / sec
  "mypy>=1.11",
  "ruff>=0.6",
  "bandit[toml]>=1.7",
  "deptry>=0.20",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
]

deferred = [
  # earned when Graph API has OpenAPI
  "schemathesis>=3.34",
  # earned when primitive suite is stable
  "mutmut>=2.5",
]

# M10 Document Classifier — extraction parser libraries. DELIBERATELY NOT in the
# main `dependencies`: these parse hostile, attacker-controlled documents and run
# ONLY inside the nsjail sandbox (eyenet/classifier/sandbox/). They install into a
# dedicated, minimal `eyenet-extract` venv that is bound READ-ONLY into the jail —
# least functionality on the hostile-parse boundary, so a parser exploit never
# reaches the main app's deps. Build the jail venv with:
#   python -m venv /opt/eyenet/extract-venv
#   /opt/eyenet/extract-venv/bin/pip install 'eyenet[extract]'
# System binaries (nsjail, tesseract-ocr) and the spaCy model are provisioned
# separately — see the install docs. spaCy itself is already a core dep above.
# Versions are forward-declared for slice 2; pins get locked when the adapters
# are wired and straced against the seccomp allowlist.
extract = [
  "pymupdf>=1.24,<2.0",           # PDF text + embedded-image extraction (AGPL — OK)
  "python-docx>=1.1,<2.0",        # DOCX text extraction
  "pytesseract>=0.3.10,<0.4",     # OCR (wraps the system `tesseract` binary)
  "presidio-analyzer>=2.2,<3.0",  # PII detection (locale-aware via spaCy)
  "Pillow>=10.0,<12.0",           # M10 slice 7 — image EXIF (local header parse only)
]

[project.scripts]
eyenet = "eyenet.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyenet"]

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  # speed (exactly one per test)
  "unit: fast, no I/O, no network, no DB. Default selection.",
  "integration: in-memory bus, in-memory or temp-file SQLite. No external processes.",
  "e2e: spawns real NATS / real services via testcontainers. Slow.",
  # category (zero or more)
  "contract: CDD contract test. Property-based or schema round-trip.",
  "calibration: stylometric AUC / discrimination tests. Needs labeled corpus.",
  "benchmark: pytest-benchmark perf assertion.",
  "schema: schemathesis HTTP API fuzzing. Needs running service.",
  "load: locust load test (run via locust CLI, not pytest).",
  "slow: tests over 5s wall-clock. Catch-all for opt-in.",
  "primitive: belongs to the BEHAVE-TEXT primitive suite.",
  "telegram: requires Telegram fixture / TDLib bind. Skipped without env flag.",
  "needs_pool: requires identity-pool fixture. Skipped without env flag.",
]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-m", "unit or contract",
  "--cov=eyenet",
  "--cov-report=term-missing",
  # TODO(EYENET v0.2): raise back to 89+ once eyenet/calibration has
  # unit-test backfill. M5 dropped total coverage ~89% -> ~85% — the
  # calibration CLI / TOML validators / sweep helpers are
  # integration-tested via `eyenet calibrate run` against the real corpus,
  # not unit-tested. Operator decision 2026-05-23: gate at 85 until v0.2.
  "--cov-fail-under=84",
  "--timeout=30",
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["eyenet"]
omit = [
  "eyenet/cli/__main__.py",
  "tests/*",
  # Requires live external services — covered by e2e tests only
  "eyenet/bus/nats.py",
  "eyenet/collectors/telegram/real.py",
  "eyenet/collectors/telegram/auth.py",
  "eyenet/collectors/matrix/real.py",
  # In-jail workers (extraction + Presidio NER): executed only inside nsjail by
  # the venv python, so coverage.py cannot trace them. Proven by real-nsjail
  # integration tests.
  "eyenet/classifier/extract/_workers/*",
  "eyenet/classifier/presidio/_workers/*",
  # Live LLM transport: needs a running Ollama daemon, so coverage.py cannot
  # trace it. The provider-agnostic advise() logic is fully unit-tested against a
  # fake BaseProvider; this thin httpx shell is proven by test_llm_real.py.
  "eyenet/classifier/llm/impl/ollama.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
fail_under = 84  # TODO(EYENET v0.2): raise back to 89+ after calibration backfill

# -----------------------------------------------------------------------------
# Ruff (strict)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# The in-jail extraction workers are standalone scripts run by a DIFFERENT
# interpreter (the eyenet-extract venv's python, inside nsjail). They import
# libraries absent from the dev/app environment and follow script idioms — they
# are not part of the checkable application surface.
extend-exclude = [
  "tests/fixtures/snapshots",
  "eyenet/classifier/extract/_workers",
  "eyenet/classifier/presidio/_workers",
]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",            # pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "N",            # pep8-naming
  "C4",           # comprehensions
  "SIM",          # simplify
  "RET",          # return
  "ARG",          # unused args
  "PL",           # pylint
  "PT",           # pytest style
  "PTH",          # use pathlib
  "ERA",          # commented-out code
  "TID",          # tidy imports
  "TCH",          # type-checking imports
  "RUF",          # ruff-specific
  "S",            # bandit-lite (security)
  "A",            # builtins shadow
  "ANN",          # annotations
  "ASYNC",        # async issues
  "DTZ",          # datetime tz awareness — ALL timestamps must be tz-aware
]
ignore = [
  "ANN401",       # Any in **kwargs ok
  "PLR0913",      # too many args — design constraint, not a smell
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",         # asserts in tests
  "S105", "S106", # dummy passwords/tokens in test fixtures
  "ANN",          # don't require annotations in tests
  "PLR2004",      # magic numbers in tests
  "ARG",          # unused args (fixtures)
  "PLC0415",      # local imports in test bodies are fine
  "PT018",        # compound assertions are fine in tests
  "PTH123",       # open() in tests is fine (no Path-aware logic needed)
  "TC001", "TC002", "TC003",  # tests construct values, not just annotate
]
# Multilingual classifier tests deliberately embed Cyrillic / CJK / Arabic
# banner strings — the "ambiguous unicode" lints are the whole point of the test.
"tests/unit/classifier/ruleset/test_engine.py" = ["RUF001", "RUF002", "RUF003"]
# Pydantic / SQLModel evaluate annotations at runtime, so TC0xx (move to
# TYPE_CHECKING) is wrong for these layers — the imports ARE runtime imports.
"eyenet/contracts/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/models/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/storage/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/bus/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/telemetry/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/service/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/identity_pool/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/collectors/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/sensor/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/engine/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/linker/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/graph/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/cli/**/*.py" = [
  "T20",       # print is fine in CLI
  "B008",      # typer.Option(...) defaults — idiomatic typer usage
  "TC001", "TC002", "TC003",
]
"eyenet/calibration/**/*.py" = [
  "T20",       # print is fine in CLI surface
  "B008",      # typer.Option(...) defaults — idiomatic typer usage
  "TC001", "TC002", "TC003",
]
"eyenet/verifier/**/*.py" = ["TC001", "TC002", "TC003"]
"eyenet/api/**/*.py" = [
  "B008",       # FastAPI Query/Path/Body in defaults — idiomatic FastAPI usage
  "S105",       # token_type="bearer" default in OAuth2 TokenPair — not a secret
  "TC001", "TC002", "TC003",  # Pydantic + FastAPI evaluate annotations at runtime
]

[tool.ruff.lint.isort]
known-first-party = ["eyenet"]
combine-as-imports = true

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime (model build), so a type used
# only in a BaseModel annotation must stay a runtime import — never moved into a
# TYPE_CHECKING block. Without this, TC001/TC003 would push enum imports out of
# scope and silently break validation.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# -----------------------------------------------------------------------------
# MyPy (strict)
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
# The in-jail workers import libraries (fitz, docx, presidio_analyzer) that live
# only in the eyenet-extract venv, never in the type-check environment. They are
# never imported by the app (only bind-mounted and run as scripts in nsjail).
exclude = ['eyenet/classifier/(extract|presidio)/_workers/']
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "telethon.*",
  "sqlite_vec.*",
  "uuid7.*",
  "uuid_extensions.*",
  "behave_text.*",
  "behave_core.*",
  "spacy.*",
  "thinc.*",
  "nio.*",
  "re2.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------------------------
# Bandit
# -----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".githooks"]
skips = ["B101"]  # assert is fine; we use it in tests + Pydantic invariants

# -----------------------------------------------------------------------------
# Deptry
# -----------------------------------------------------------------------------
[tool.deptry]
known_first_party = ["eyenet"]
# The in-jail workers import the extract-venv libs (fitz/docx/presidio); they run
# in a separate environment, so deptry must not read them as app-level dependencies.
extend_exclude = [
  "tests",
  "scripts",
  "eyenet/classifier/extract/_workers",
  "eyenet/classifier/presidio/_workers",
]
# DEP002 is suppressed globally: EYENET declares its full runtime dep set
# upfront (all milestone deps in one place). Deptry can't distinguish
# "not used yet" from "genuinely unnecessary." Audit manually at each release.
ignore = ["DEP002"]
[tool.deptry.package_module_name_map]
PySocks = "socks"
google-re2 = "re2"
