<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Purple" subtitle="Accent for primary actions, links, selection" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--black);padding:16px;font-family:var(--font-mono)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border:1px solid var(--border);border-radius:4px;overflow:hidden}
.chip{height:64px}
.meta{padding:6px 8px;background:var(--surface);border-top:1px solid var(--border)}
.name{font-size:11px;color:var(--text);letter-spacing:.02em}
.val{font-size:10px;color:var(--text-faint);margin-top:2px}</style></head>
<body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="name">--accent</div><div class="val">#743093 · fills</div></div></div>
<div class="sw"><div class="chip" style="background:var(--accent-hover)"></div><div class="meta"><div class="name">--accent-hover</div><div class="val">#8a3fae</div></div></div>
<div class="sw"><div class="chip" style="background:var(--accent-text)"></div><div class="meta"><div class="name">--accent-text</div><div class="val">#a259c4 · text/links</div></div></div>
<div class="sw"><div class="chip" style="background:var(--accent-fill);border:1px solid var(--accent)"></div><div class="meta"><div class="name">--accent-fill</div><div class="val">16% selection</div></div></div>
</div></body></html>
