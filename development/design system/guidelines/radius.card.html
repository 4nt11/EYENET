<!-- @dsCard group="Spacing" viewport="700x140" name="Radius & Border" subtitle="4px radius, 1px hairline — the only elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--black);padding:20px;font-family:var(--font-mono)}
.row{display:flex;gap:20px;align-items:center}
.cell{display:flex;flex-direction:column;gap:8px;align-items:center}
.box{width:80px;height:56px;background:var(--panel);border:1px solid var(--border)}
.n{font-size:11px;color:var(--text)}.v{font-size:10px;color:var(--text-faint)}</style></head>
<body><div class="row">
<div class="cell"><div class="box" style="border-radius:0"></div><div class="n">--radius-none</div><div class="v">0px</div></div>
<div class="cell"><div class="box" style="border-radius:2px"></div><div class="n">--radius-sm</div><div class="v">2px · badges</div></div>
<div class="cell"><div class="box" style="border-radius:4px"></div><div class="n">--radius</div><div class="v">4px · everything</div></div>
<div class="cell"><div class="box" style="border-radius:4px;border-color:var(--accent)"></div><div class="n">1px hairline</div><div class="v">the only elevation</div></div>
</div></body></html>
