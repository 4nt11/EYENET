notes: >
  Meta-family, not a stealer. Flat url:user:pass (or ;/|-separated)
  files that aggregate credentials from many sources and campaigns.
  Our combolist_container rule fires as the L1 fallback when no
  stealer family matches; the per-shape probes (combolist_ulp_colon,
  _semicolon, _pipe, _any_scheme, _schemeless, _email_colon,
  _android, _ulpextract_tsv) classify the row format. ulpextract
  remains the authoritative per-row credential ingester.
