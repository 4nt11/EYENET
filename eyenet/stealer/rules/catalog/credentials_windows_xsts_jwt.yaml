id: credentials_windows_xsts_jwt
version: 1
layer: content
family: victim_msa_tokens
priority: 95
path_glob: "**/CredentialsWindows.txt"
description: >
  ONE shape of MSA token leaked via Windows Credential Manager: the
  Xbox Secure Token Service (XSTS) JSON-wrapped JWT format used by
  Xbox Live, PlayFab, Epic Online Services, bethesda.net, and friends.
  Named credentials_windows_xsts_jwt explicitly because MSA tokens
  surface in several other shapes we have not caught yet: OAuth
  refresh tokens in a different Pass serialisation, graph.microsoft
  .com SSO blobs, older binary PRT (Primary Refresh Token) wrappings,
  Chromium-Edge's `Web Data` MSA entries. Each gets its own rule
  siblings into the victim_msa_tokens family when samples turn up.

  Previously swept up by the generic windows_credentials rule into
  the `password` field as an opaque JSON blob (~52% of all
  windows_credentials rows on prod turned out to be these). Each
  token is a signed XSTS JWT bound to a specific RelyingParty;
  WITH the full signature, replay gives full session access to
  that service as the victim without touching the MSA password or
  any MFA challenge.

  Known limitation (upstream, not fixable at the rule layer): every
  sampled stealer that dumps CredentialsWindows.txt truncates the
  Pass line at 516-517 bytes (6 for "Pass: " + 512 payload). The
  signature segment is physically ABSENT from the dump. Confirmed as
  a Windows SDK artifact, NOT a stealer flaw: the Xbox client
  library writes tokens via CredWriteW with the Vista-era
  CRED_MAX_CREDENTIAL_BLOB_SIZE = 512-byte cap. Microsoft raised the
  value to 2560 for current SDKs, but legacy bindings (FreePascal
  JEDI, FreeRDP's winpr credentials.h) still carry the 512 constant,
  and the Xbox SDK evidently never bumped it. Any stealer reading
  the Credential Manager inherits the truncation; captured JWT is
  always header.partial-payload, never header.payload.signature.
  See Docker secrets-engine PR 474 (chunks credentials around the
  same cap) and Git's wincred inline-refresh-token patch (same
  workaround) for public confirmation that this is a known pain
  point in production codebases.

  Operator value from the partial form:
    - BLUE: header carries the signing key thumbprint (x5t); enough
      to correlate against the IdP key catalogue and force revoke.
      Plus msa_user_id + relying_party for scope assessment.
    - RED (with express authorization): the signing key thumbprint
      is intel on which key MS used for this user's session, but the
      unsigned fragment cannot be replayed. Dump is a leak-evidence
      artifact, not a live token.

  Different serialisations (full 3-segment JWT) may exist in other
  stealer families we have not collected yet; they will land as
  sibling rules in the victim_msa_tokens family.

  Credential Manager dumps use a stable 3-line record shape:

    Target: LegacyGeneric:target=XblGrts|<id>|<msa>|<env>|RETAIL|Xtoken|<relying-party>|JWT
    User:   N/A
    Pass:   {"MsaUserId":"<msa>","HasSignInDisplayClaims":<bool>,
             "IdentityType":"Xtoken","Environment":"Production",
             "Sandbox":"RETAIL","TokenType":"JWT",
             "RelyingParty":"<url>","SubRelyingParty":"",
             "TokenData":{"Token":"<jwt>", ...}}

  Field order inside the JSON is deterministic (Windows Credential
  Manager serialises keys in insertion order), so we can regex-walk
  without a real JSON parser. RE2 requires no backtracking because
  every key appears exactly once per record and every value is
  bounded by the next literal `","`.

  CTI payload:
    - msa_user_id     the stable MS Account ID. Joins across victims
                      the same person logged into on multiple PCs.
    - relying_party   the target service (xboxlive, playfab,
                      eos.epicgames, bethesda.net). Operator filters
                      by service to see which accounts are exposed.
    - token_type      always "JWT" today, column kept for future
                      signed-cookie / opaque-token variants.
    - jwt             the actual replayable token body. Full decode
                      lives in the Python side (same base64url path
                      as the localStorage JWT endpoint).

match:
  type: regex
  # JWT capture is bounded by [^"\r\n] because the stealer truncates
  # the Pass line at an arbitrary length, which means the closing quote
  # of the "Token":"<jwt>" value is often missing and a greedy [^"]+
  # would run past the line break into the next record's Target field.
  # JWTs are base64url so \r and \n are safe terminators.
  pattern: '(?ms)^Target:\s*(?P<target>[^\r\n]+)\s*\nUser:\s*(?P<user>[^\r\n]+)\s*\nPass:\s*\{"MsaUserId":"(?P<msa_user_id>[^"]+)","HasSignInDisplayClaims":(?:true|false),"IdentityType":"(?P<identity_type>[^"]+)","Environment":"(?P<environment>[^"]+)","Sandbox":"(?P<sandbox>[^"]+)","TokenType":"(?P<token_type>[^"]+)","RelyingParty":"(?P<relying_party>[^"]+)".*?"Token":"(?P<jwt>[^"\r\n]+)'
  pre_contains: '"MsaUserId"'

extract:
  fields:
    - target
    - user
    - msa_user_id
    - identity_type
    - environment
    - sandbox
    - token_type
    - relying_party
    - jwt

ttps:
  - T1555.004
