# --- bot: 1 observed in Rutify corpus -----------------------------------
#
# Sub-threshold for the simhash min_messages=50 floor (35 msgs) but the
# stats row is appended to rutify_actor_stats.csv specifically for recipe
# calibration. Simhash grid still ignores SangMata via its own MIN_TOKENS
# gates. See operator decision 2026-05-22 ("Keep floor at 50; add SangMata
# as a special labeled row").
#
# SangMata signature (the recipe's positive example):
#   init_rate = 1.000        (every msg is a name-change event notification)
#   length_cv = 0.129        (templated string `User \`X\` changed name…`)
#   inter_msg_cv = 1.67      (event-driven; NOT clockwork — do not gate on this)
#   mattr = 0.491            (low lexical diversity vs human cohort min=0.82)
# Recipe axes locked to init_rate >= 0.95 AND length_cv <= 0.30. MATTR
# discriminates too but is not part of v0; reserved for future tightening.

[[actor]]
sender_id = 5422359176
label = "bot"
confidence = "high"
notes = "SangMata_beta_bot; 35 msgs; init_rate=1.000, length_cv=0.129; templated event-driven name-change notifier — every message is `User \\`<id>\\` changed name/username from X to Y`. Only confirmed bot in the corpus that posts text. QuotLyBot (1031952739) has only 4 msgs; too few for reliable stats so excluded from labels."

