<!-- @dsCard group="Colors" viewport="700x150" name="Signal — Red" subtitle="Reserved: top-tier alerts, tamper, destructive only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--black);padding:16px;font-family:var(--font-mono)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border:1px solid var(--border);border-radius:4px;overflow:hidden}
.chip{height:64px}
.meta{padding:6px 8px;background:var(--surface);border-top:1px solid var(--border)}
.name{font-size:11px;color:var(--text);letter-spacing:.02em}
.val{font-size:10px;color:var(--text-faint);margin-top:2px}</style></head>
<body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--red)"></div><div class="meta"><div class="name">--red</div><div class="val">#c2453f · destructive</div></div></div>
<div class="sw"><div class="chip" style="background:var(--red-hover)"></div><div class="meta"><div class="name">--red-hover</div><div class="val">#d1524b</div></div></div>
<div class="sw"><div class="chip" style="background:var(--red-text)"></div><div class="meta"><div class="name">--red-text</div><div class="val">#e07b76 · critical text</div></div></div>
<div class="sw"><div class="chip" style="background:var(--red-fill);border:1px solid var(--red)"></div><div class="meta"><div class="name">--red-fill</div><div class="val">14% tamper bg</div></div></div>
</div></body></html>
