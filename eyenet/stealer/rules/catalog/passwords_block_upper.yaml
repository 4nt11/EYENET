id: passwords_block_upper
version: 1
layer: content
family: browser_passwords
priority: 80
path_glob: "**/*.txt"
description: >
  UPPERCASE passwords.txt block format. 37 of 439 Khazan victims ship
  this (json_v2 cluster: StealC v2 / Acreed / Stealerium). Often
  BOM-prefixed. Keys: SOFT, URL, USER, PASS. Fires in parallel with
  passwords_block_title; whichever shape matches a given file wins
  because the other regex simply won't find its anchor.
match:
  type: regex
  pattern: 'SOFT:\s*(?P<soft>[^\n]*)\nURL:\s*(?P<url>[^\n]*)\nUSER:\s*(?P<user>[^\n]*)\nPASS:\s*(?P<password>[^\n]*)'
extract:
  fields: [soft, url, user, password]
normalize:
  - verb: derive_url_parts
    field: url
    host_to: host
    scheme_to: scheme
    tld_to: tld
ttps:
  - T1555.003
